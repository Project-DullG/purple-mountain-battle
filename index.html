<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보랏빛 산지의 전투</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- 마을 화면 (통합) -->
        <div id="village-screen" class="screen">
            <h1>보랏빛 산지의 전투</h1>

            <!-- 플레이어 정보 -->
            <div id="player-info">
                <div class="info-row">
                    <span>Lv.<span id="player-level">1</span></span>
                    <span>골드: <span id="player-gold">0</span></span>
                </div>
                <div class="info-row">
                    <span>EXP: <span id="player-exp">0</span>/<span id="player-max-exp">100</span></span>
                    <span>해금: <span id="unlocked-floor">1</span>층</span>
                </div>
            </div>

            <!-- 스탯 섹션 -->
            <div class="section">
                <h2>스탯 <span class="point-badge">포인트: <span id="stat-points">0</span></span></h2>
                <div id="stats-grid">
                    <div class="stat-item">
                        <div class="stat-header">
                            <span class="stat-name">힘</span>
                            <span class="stat-value" id="stat-str">5</span>
                            <button class="btn-stat-up" data-stat="str">+</button>
                        </div>
                        <span class="stat-desc">공격력 증가</span>
                    </div>
                    <div class="stat-item">
                        <div class="stat-header">
                            <span class="stat-name">민첩</span>
                            <span class="stat-value" id="stat-dex">5</span>
                            <button class="btn-stat-up" data-stat="dex">+</button>
                        </div>
                        <span class="stat-desc">회피율 증가</span>
                    </div>
                    <div class="stat-item">
                        <div class="stat-header">
                            <span class="stat-name">지능</span>
                            <span class="stat-value" id="stat-int">5</span>
                            <button class="btn-stat-up" data-stat="int">+</button>
                        </div>
                        <span class="stat-desc">최대 MP 증가</span>
                    </div>
                    <div class="stat-item">
                        <div class="stat-header">
                            <span class="stat-name">행운</span>
                            <span class="stat-value" id="stat-luk">5</span>
                            <button class="btn-stat-up" data-stat="luk">+</button>
                        </div>
                        <span class="stat-desc">크리티컬/드랍률</span>
                    </div>
                </div>
            </div>

            <!-- 스킬 섹션 -->
            <div class="section">
                <h2>스킬 세팅</h2>
                <div id="skill-grid">
                    <div class="skill-item" data-character="cat">
                        <div class="skill-header">
                            <span class="char-name">묘인</span>
                            <select class="skill-select" data-character="cat"></select>
                        </div>
                        <p class="skill-desc" id="skill-desc-cat">스킬을 선택하세요</p>
                    </div>
                    <div class="skill-item" data-character="elf">
                        <div class="skill-header">
                            <span class="char-name">엘프</span>
                            <select class="skill-select" data-character="elf"></select>
                        </div>
                        <p class="skill-desc" id="skill-desc-elf">스킬을 선택하세요</p>
                    </div>
                    <div class="skill-item" data-character="dwarf">
                        <div class="skill-header">
                            <span class="char-name">드워프</span>
                            <select class="skill-select" data-character="dwarf"></select>
                        </div>
                        <p class="skill-desc" id="skill-desc-dwarf">스킬을 선택하세요</p>
                    </div>
                    <div class="skill-item" data-character="human">
                        <div class="skill-header">
                            <span class="char-name">인간</span>
                            <select class="skill-select" data-character="human"></select>
                        </div>
                        <p class="skill-desc" id="skill-desc-human">스킬을 선택하세요</p>
                    </div>
                </div>
            </div>

            <!-- 상점 섹션 -->
            <div class="section">
                <h2>상점</h2>
                <div id="shop-grid">
                    <div class="shop-item">
                        <div class="shop-info">
                            <span>무기 강화</span>
                            <span class="shop-level">Lv.<span id="weapon-level">1</span></span>
                        </div>
                        <button id="btn-upgrade-weapon" class="btn-shop">
                            <span id="weapon-cost">100</span>G
                        </button>
                    </div>
                    <div class="shop-item">
                        <div class="shop-info">
                            <span>HP 포션</span>
                            <span class="shop-desc">HP +50</span>
                        </div>
                        <button id="btn-buy-potion" class="btn-shop">50G</button>
                    </div>
                </div>
            </div>

            <!-- 던전 입장 -->
            <button id="btn-dungeon" class="btn-enter">던전 입장 (<span id="start-floor">1</span>층~)</button>
        </div>

        <!-- 던전 화면 -->
        <div id="dungeon-screen" class="screen hidden">
            <div id="dungeon-header">
                <span class="floor-info"><span id="current-floor">1</span>층</span>
                <span class="pending-info">+<span id="pending-gold">0</span>G / +<span id="pending-exp">0</span>EXP</span>
            </div>

            <div id="battle-area">
                <div id="enemy-info">
                    <h2 id="enemy-name">고블린</h2>
                    <div class="enemy-stats">
                        <span>HP: <span id="enemy-hp">50</span></span>
                        <span>공격력: <span id="enemy-atk">10</span></span>
                    </div>
                </div>

                <div id="player-battle-info">
                    <div class="battle-stat">
                        <span class="label">HP</span>
                        <div class="bar-container">
                            <div class="bar hp-bar" id="hp-bar"></div>
                        </div>
                        <span class="value"><span id="battle-hp">100</span>/<span id="battle-max-hp">100</span></span>
                    </div>
                    <div class="battle-stat">
                        <span class="label">MP</span>
                        <div class="bar-container">
                            <div class="bar mp-bar" id="mp-bar"></div>
                        </div>
                        <span class="value"><span id="battle-mp">5</span>/<span id="battle-max-mp">5</span></span>
                    </div>
                </div>
            </div>

            <div id="battle-log"></div>

            <div id="battle-actions">
                <button id="btn-attack">공격</button>
                <button id="btn-skill-1" class="btn-skill" title="">스킬1</button>
                <button id="btn-skill-2" class="btn-skill" title="">스킬2</button>
                <button id="btn-skill-3" class="btn-skill" title="">스킬3</button>
                <button id="btn-skill-4" class="btn-skill" title="">스킬4</button>
            </div>

            <div id="floor-clear-actions" class="hidden">
                <button id="btn-next-floor">다음 층</button>
                <button id="btn-return">복귀 (100%)</button>
            </div>
        </div>

        <!-- 게임 오버 화면 -->
        <div id="gameover-screen" class="screen hidden">
            <h1>패배</h1>
            <p class="death-msg">획득 보상의 50%를 가져갑니다</p>
            <div class="death-rewards">
                <p>+<span id="death-gold">0</span> 골드</p>
                <p>+<span id="death-exp">0</span> 경험치</p>
            </div>
            <button id="btn-gameover-return">마을로</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
